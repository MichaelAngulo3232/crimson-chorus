name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-universal, os: macos-latest,   label: macOS,   readme: packaging/README-macos.txt }
          - { name: windows,         os: windows-latest, label: Windows, readme: packaging/README-windows.txt }
          - { name: linux,           os: ubuntu-22.04,   label: Linux,   readme: packaging/README-linux.txt }
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS universal targets
        if: matrix.name == 'macos-universal'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Package plugins
        run: |
          runner_name=${{ matrix.name }}
          if [[ $runner_name = 'macos-universal' ]]; then
            export MACOSX_DEPLOYMENT_TARGET=10.13
            cargo xtask bundle-universal chorus --release
          else
            cargo xtask bundle chorus --release
          fi

      # bundler.toml maps package `chorus` -> bundle name `Crimson`,
      # so target/bundled/ already contains Crimson.vst3 / Crimson.clap.
      - name: Assemble release folder
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          folder="Crimson-${version}-${{ matrix.label }}"
          echo "FOLDER=$folder" >> "$GITHUB_ENV"

          mkdir -p "out/$folder"
          cp -R target/bundled/* "out/$folder/"
          cp "${{ matrix.readme }}" "out/$folder/README.txt"
          [ -f LICENSE ] && cp LICENSE "out/$folder/LICENSE.txt"

          echo "--- packaged ---"
          ls -la "out/$folder"

      - name: Verify bundle names
        run: |
          cd "out/$FOLDER"
          test -e Crimson.vst3 || { echo "::error::Crimson.vst3 missing — is bundler.toml present at the repo root?"; exit 1; }
          test -e Crimson.clap || { echo "::error::Crimson.clap missing"; exit 1; }
          test -e README.txt   || { echo "::error::README.txt missing"; exit 1; }
          grep -q "quarantine" README.txt || echo "::warning::macOS Gatekeeper note not found in README"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FOLDER }}
          path: out/${{ env.FOLDER }}/*
