name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  check-version:
    name: Check version consistency
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $cargo_version"
          echo "Git tag:    $tag_version"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag v$tag_version does not match Cargo.toml version $cargo_version. Bump Cargo.toml, commit, then re-tag."
            exit 1
          fi
          echo "Versions agree."

  build:
    # check-version only runs on tags; always() lets normal pushes build anyway,
    # but a FAILED guard still blocks the build.
    if: always() && needs.check-version.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-universal, os: macos-latest,   label: macOS,   readme: packaging/README-macos.txt }
          - { name: windows,         os: windows-latest, label: Windows, readme: packaging/README-windows.txt }
          - { name: linux,           os: ubuntu-22.04,   label: Linux,   readme: packaging/README-linux.txt }
    name: Build ${{ matrix.name }}
    needs: [check-version]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS universal targets
        if: matrix.name == 'macos-universal'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        if: matrix.name == 'linux'
        run: cargo clippy --release -- -D warnings

      - name: Build and bundle
        run: |
          if [[ "${{ matrix.name }}" = 'macos-universal' ]]; then
            export MACOSX_DEPLOYMENT_TARGET=10.13
            cargo xtask bundle-universal chorus --release
          else
            cargo xtask bundle chorus --release
          fi

      # Releases only: sign with the Developer ID, send to Apple for
      # notarization, then staple Apple's approval onto each bundle so
      # macOS opens them with no Gatekeeper warning. Normal pushes and
      # PRs skip this and build unsigned, same as before.
      - name: Sign, notarize and build installer (macOS)
        if: matrix.name == 'macos-universal' && startsWith(github.ref, 'refs/tags/v')
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          [ -n "$CERT_P12" ] || { echo "::error::MACOS_CERT_P12 secret is missing. Add the signing secrets before tagging a release."; exit 1; }

          # 1. Load the certificate into a temporary keychain on this runner.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          PLUGINS=(target/bundled/Crimson.vst3 target/bundled/Crimson.clap)

          # 2. Sign. --timestamp and --options runtime are required by notarization.
          for p in "${PLUGINS[@]}"; do
            codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" --sign "$IDENTITY" "$p"
          done

          # 3. Send to Apple and wait for the verdict.
          ditto -c -k --keepParent target/bundled "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait

          # 4. Staple the approval onto each bundle. Fails (and blocks the
          #    release) if Apple rejected the upload.
          for p in "${PLUGINS[@]}"; do
            xcrun stapler staple "$p"
            xcrun stapler validate "$p"
          done

          # 5. Build the installer: one .pkg that puts each format into the
          #    system plug-in folders. It's signed with the Developer ID
          #    Installer certificate, whose name is IDENTITY with "Installer"
          #    in place of "Application".
          INSTALLER_IDENTITY="${IDENTITY/Application/Installer}"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          PKGWORK="$RUNNER_TEMP/pkg"
          mkdir -p "$PKGWORK/vst3" "$PKGWORK/clap"
          ditto target/bundled/Crimson.vst3 "$PKGWORK/vst3/Crimson.vst3"
          ditto target/bundled/Crimson.clap "$PKGWORK/clap/Crimson.clap"

          for fmt in vst3 clap; do
            # Not relocatable: always install into the plug-in folder, even if
            # macOS finds another copy of the bundle somewhere else on disk.
            pkgbuild --analyze --root "$PKGWORK/$fmt" "$PKGWORK/$fmt.plist"
            if plutil -extract 0.RootRelativeBundlePath raw -o - "$PKGWORK/$fmt.plist" >/dev/null 2>&1; then
              plutil -replace 0.BundleIsRelocatable -bool NO "$PKGWORK/$fmt.plist"
            fi
          done
          pkgbuild --root "$PKGWORK/vst3" --component-plist "$PKGWORK/vst3.plist" \
            --identifier tech.pyfessional.crimson.vst3 --version "$VERSION" \
            --install-location /Library/Audio/Plug-Ins/VST3 "$PKGWORK/Crimson-VST3.pkg"
          pkgbuild --root "$PKGWORK/clap" --component-plist "$PKGWORK/clap.plist" \
            --identifier tech.pyfessional.crimson.clap --version "$VERSION" \
            --install-location /Library/Audio/Plug-Ins/CLAP "$PKGWORK/Crimson-CLAP.pkg"

          # The installer window: title, and a choice per format (both on by default).
          cat > "$PKGWORK/distribution.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
              <title>Crimson ${VERSION}</title>
              <options customize="allow" require-scripts="false" hostArchitectures="x86_64,arm64"/>
              <domains enable_localSystem="true"/>
              <choices-outline>
                  <line choice="vst3"/>
                  <line choice="clap"/>
              </choices-outline>
              <choice id="vst3" title="Crimson VST3" description="Installs Crimson.vst3 into /Library/Audio/Plug-Ins/VST3.">
                  <pkg-ref id="tech.pyfessional.crimson.vst3"/>
              </choice>
              <choice id="clap" title="Crimson CLAP" description="Installs Crimson.clap into /Library/Audio/Plug-Ins/CLAP.">
                  <pkg-ref id="tech.pyfessional.crimson.clap"/>
              </choice>
              <pkg-ref id="tech.pyfessional.crimson.vst3" version="${VERSION}">Crimson-VST3.pkg</pkg-ref>
              <pkg-ref id="tech.pyfessional.crimson.clap" version="${VERSION}">Crimson-CLAP.pkg</pkg-ref>
          </installer-gui-script>
          XML

          productbuild --distribution "$PKGWORK/distribution.xml" --package-path "$PKGWORK" \
            --sign "$INSTALLER_IDENTITY" --keychain "$KEYCHAIN" --timestamp Crimson-macOS.pkg

          # 6. Notarize and staple the installer, then check Gatekeeper accepts it.
          xcrun notarytool submit Crimson-macOS.pkg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple Crimson-macOS.pkg
          xcrun stapler validate Crimson-macOS.pkg
          spctl --assess --type install -vv Crimson-macOS.pkg

      # bundler.toml maps package `chorus` -> bundle name `Crimson`.
      # Zip NAME is stable so the site can link to /releases/latest/download/.
      # The version lives INSIDE: the folder name and the README.
      - name: Package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          inner="Crimson-${version}-${{ matrix.label }}"
          zipname="Crimson-${{ matrix.label }}.zip"
          echo "ZIPNAME=$zipname" >> "$GITHUB_ENV"
          echo "PKGVERSION=$version" >> "$GITHUB_ENV"

          mkdir -p "staging/$inner"
          cp -R target/bundled/* "staging/$inner/"
          sed "s/__VERSION__/v${version}/" "${{ matrix.readme }}" > "staging/$inner/README.txt"
          if [ -f LICENSE ]; then cp LICENSE "staging/$inner/LICENSE.txt"; fi

          cd staging
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            powershell -Command "Compress-Archive -Path '$inner' -DestinationPath '../$zipname'"
          else
            zip -r -q "../$zipname" "$inner"
          fi

      - name: Verify
        run: |
          cd staging/*/
          test -e Crimson.vst3 || { echo "::error::Crimson.vst3 missing - is bundler.toml at the repo root?"; exit 1; }
          test -e Crimson.clap || { echo "::error::Crimson.clap missing"; exit 1; }
          grep -q "^CRIMSON  v${PKGVERSION}$" README.txt || {
            echo "::error::README header is '$(head -1 README.txt)' but should be 'CRIMSON  v${PKGVERSION}'. The packaging/README-*.txt files must contain the literal __VERSION__ placeholder."
            exit 1; }
          echo "Packaged OK:"; ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ env.ZIPNAME }}

      - name: Upload installer (macOS)
        if: matrix.name == 'macos-universal' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Crimson-macOS.pkg
          path: Crimson-macOS.pkg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.pkg
          generate_release_notes: true
